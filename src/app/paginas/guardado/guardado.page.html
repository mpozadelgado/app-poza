<ion-header>
  <ion-toolbar>
    <ion-title>Guardado</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="rejilla">
    @for (prenda of guardadas; track prenda.id; let i = $index) {
      <app-tarjeta-prenda class="entrada" [style.--orden]="i" [prenda]="prenda"></app-tarjeta-prenda>
    } @empty {
      <app-estado-vacio class="todo-el-ancho" icono="heart-outline" titulo="Aún no has guardado nada" texto="Toca el corazón de una prenda para guardarla aquí.">
        <ion-button fill="outline" routerLink="/app/explorar">Explorar prendas</ion-button>
      </app-estado-vacio>
    }
  </div>
</ion-content>
