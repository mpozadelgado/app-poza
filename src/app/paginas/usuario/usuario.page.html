<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/app/explorar"></ion-back-button>
    </ion-buttons>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (perfil(); as u) {
    <app-cabecera-perfil [perfil]="u" [prendas]="prendas().length"></app-cabecera-perfil>
    <h3 class="apartado">Su armario</h3>
    <div class="fotos">
      @for (prenda of prendas(); track prenda.id) {
        <a [routerLink]="['/app/explorar', prenda.id]">
          <img [src]="prenda.foto" [alt]="prenda.titulo" />
        </a>
      }
    </div>
  } @else {
    <app-estado-vacio icono="person-outline" titulo="Perfil no encontrado"></app-estado-vacio>
  }
</ion-content>
