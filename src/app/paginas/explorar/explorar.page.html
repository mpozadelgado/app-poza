<ion-header>
  <ion-toolbar>
    <ion-title>Explorar</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/notificaciones" aria-label="Notificaciones">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (prenda of prendas; track prenda.id) {
      <ion-item [routerLink]="['/app/explorar', prenda.id]" [button]="true">
        <ion-thumbnail slot="start">
          <img [src]="prenda.foto" [alt]="prenda.titulo" />
        </ion-thumbnail>
        <ion-label>
          <h2>{{ prenda.titulo }}</h2>
          <p>Talla {{ prenda.talla }} · {{ prenda.estado }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
