<ion-header>

      <ion-back-button defaultHref="/app/explorar"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p>Estás viendo la prenda con id = {{ id() }}</p>

</ion-content>
